name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make

      - name: Install toolchain (ARM GNU 10-2020-q4, same as local EIDE 10.2.1)
        run: |
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu-rm/10-2020q4/gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2"
          tar xjf gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2
          echo "$PWD/gcc-arm-none-eabi-10-2020-q4-major/bin" >> "$GITHUB_PATH"

      - name: Build firmware
        working-directory: cubemx_source
        run: |
          cmake -B ../build -DCMAKE_BUILD_TYPE=Debug
          cmake --build ../build -j"$(nproc)"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/cubemx.elf
            build/cubemx.hex
            build/cubemx.bin
