name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download toolchain (ARM GNU 10-2020-q4, same as local EIDE 10.2.1)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://developer.arm.com/-/media/Files/downloads/gnu-rm/10-2020q4/gcc-arm-none-eabi-10-2020-q4-major-win32.zip" -OutFile "$env:RUNNER_TEMP/toolchain.zip"
          Expand-Archive "$env:RUNNER_TEMP/toolchain.zip" "$env:RUNNER_TEMP/toolchain"

      - name: Download EIDE builder (extension 3.27.2)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://open-vsx.org/api/cl/eide/3.27.2/file/cl.eide-3.27.2.vsix" -OutFile "$env:RUNNER_TEMP/eide.vsix"
          Expand-Archive "$env:RUNNER_TEMP/eide.vsix" "$env:RUNNER_TEMP/eide"

      - name: Build firmware with EIDE unify_builder
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE.Replace('\','/')
          $toolchain = "$env:RUNNER_TEMP/toolchain/gcc-arm-none-eabi-10-2020-q4-major"
          $env:Path = "$toolchain/bin;$env:Path"
          $tpl = Get-Content "$ws/eide/ci/builder.params.template" -Raw
          $params = $tpl.Replace('__ROOT_DIR__', $ws) `
                        .Replace('__TOOLCHAIN__', $toolchain) `
                        .Replace('__MODEL__', "$ws/eide/ci/arm.gcc.model.json") `
                        .Replace('__LINK_SCRIPT__', "$ws/cubemx_source/STM32F103XX_FLASH.ld")
          New-Item -ItemType Directory -Path "$ws/build/Debug" -Force | Out-Null
          $params | Set-Content "$ws/build/Debug/builder.params" -Encoding UTF8
          $builder = "$env:RUNNER_TEMP/eide/extension/res/tools/win32/unify_builder/unify_builder.exe"
          & $builder -p "$ws/build/Debug/builder.params" --rebuild --no-color
          if ($LASTEXITCODE -ne 0) { throw "EIDE build failed" }

      - name: Create release and upload firmware
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            build/Debug/stm32f1xx_cubemx.elf `
            build/Debug/stm32f1xx_cubemx.hex `
            build/Debug/stm32f1xx_cubemx.bin `
            --generate-notes
