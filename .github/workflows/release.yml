name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make

      - name: Build firmware
        working-directory: cubemx_source
        run: make -j"$(nproc)"

      - name: Create release and upload firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            cubemx_source/build/cubemx.elf \
            cubemx_source/build/cubemx.hex \
            cubemx_source/build/cubemx.bin \
            --generate-notes
